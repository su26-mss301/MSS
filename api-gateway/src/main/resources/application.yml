server:
  port: 8080

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/smart-wardrobe

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users/**
            - id: wardrobe-service
              uri: lb://wardrobe-service
              predicates:
                - Path=/api/v1/wardrobe/**
            - id: recommendation-service
              uri: lb://recommendation-service
              predicates:
                - Path=/api/v1/recommendation/**
            - id: ai-detection-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/ai/**
              filters:
                - StripPrefix=3
            - id: storage-service
              uri: lb://storage-service
              predicates:
                - Path=/api/v1/storage/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}
