services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4
    container_name: smart-wardrobe-keycloak
    command:
      - start-dev
      - --import-realm
    ports:
      - "8180:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json

  ai-postgres:
    image: postgres:15
    container_name: smart-wardrobe-ai-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: ai_detection_db
    ports:
      - "5439:5432"
    volumes:
      - ai-postgres-data:/var/lib/postgresql/data

volumes:
  ai-postgres-data: