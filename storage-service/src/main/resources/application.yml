spring:
  application:
    name: storage-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/storage_db}
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8085
  servlet:
    context-path: /api/v1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}

aws:
  s3:
    endpoint: ${AWS_S3_ENDPOINT:}
    region: ${AWS_REGION:us-east-1}
    access-key: ${AWS_ACCESS_KEY_ID:minioadmin}
    secret-key: ${AWS_SECRET_ACCESS_KEY:minioadmin}
    bucket-name: ${AWS_S3_BUCKET:wardrobe-images}

jwt:
  secret: ${JWT_SECRET}

storage:
  cleanup:
    detecting-ttl-minutes: ${DETECTING_TTL_MINUTES:30}   # Xóa ảnh DETECTING sau N phút
    scheduler-interval-ms: ${CLEANUP_INTERVAL_MS:300000} # Chạy scheduler mỗi N ms (default: 5 phút)
