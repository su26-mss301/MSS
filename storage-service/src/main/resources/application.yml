spring:
  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      group-id: storage-clothing-created-group
      auto-offset-reset: earliest
      enable-auto-commit: false

      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: wardrobe.project.com.storageservice.event.ClothingCreatedEvent
        spring.json.trusted.packages: wardrobe.project.com.storageservice.event
        spring.json.use.type.headers: false

    listener:
      ack-mode: record

  application:
    name: storage-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/storage_db}
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8085
  servlet:
    context-path: /api/v1/storage


management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

aws:
  s3:
    endpoint: ${AWS_S3_ENDPOINT:}
    region: ${AWS_REGION:us-east-1}
    access-key: ${AWS_ACCESS_KEY_ID:minioadmin}
    secret-key: ${AWS_SECRET_ACCESS_KEY:minioadmin}
    bucket-name: ${AWS_S3_BUCKET:wardrobe-images}

jwt:
  secret: ${JWT_SECRET}

storage:
  cleanup:
    detecting-ttl-minutes: ${DETECTING_TTL_MINUTES:30}   # Xóa ảnh DETECTING sau N phút
    scheduler-interval-ms: ${CLEANUP_INTERVAL_MS:300000} # Chạy scheduler mỗi N ms (default: 5 phút)

app:
  kafka:
    topic:
      clothing-created: clothing-created