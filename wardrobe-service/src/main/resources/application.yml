spring:
  application:
    name: wardrobe-service
  datasource:
    url: jdbc:postgresql://localhost:5434/wardrobe_service_db
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8082}
  servlet:
    context-path: /api/v1/wardrobe
