spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5435/user_service_db
    username: admin
    password: admin123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://cognito-idp.ap-southeast-2.amazonaws.com/ap-southeast-2_uDAME2CDM

server:
  port: 8081
  servlet:
    context-path: /api/v1/users

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}

aws:
  cognito:
    region: ${AWS_REGION}
    client-id: ${AWS_CLIENT_ID}
    user-pool-id: ${AWS_USER_POOL_ID}
    default-group: ROLE_USER