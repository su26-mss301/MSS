spring:
  data:
    redis:
      host: localhost
      port: 6380

  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true

    consumer:
      group-id: user-service-keycloak-sync
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "wardrobe.project.com.userservice.event"

    listener:
      ack-mode: record

  application:
    name: user-service

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${APP_EMAIL}
    password: ${APP_PASSWORD}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  datasource:
    url: jdbc:postgresql://localhost:5435/user_service_db
    username: admin
    password: admin123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/smart-wardrobe
server:
  port: 8081
  servlet:
    context-path: /api/v1/users

    keycloak:
      server-url: ${KEYCLOAK_SERVER_URL}
      admin-realm: ${KEYCLOAK_ADMIN_REALM}
      app-realm: ${KEYCLOAK_APP_REALM}

      # dùng cho user login
      client-id: ${KEYCLOAK_CLIENT_ID}
      client-secret: ${KEYCLOAK_CLIENT_SECRET}

      # dùng cho admin API, nhưng dùng chung client
      admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID}
      admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}


app:
  cookie:
    secure: false
    same-site: Lax
  auth:
    refresh-token-cookie-max-age-days: 8
    id-token-cookie-max-age-minutes: 20
    access-token-cookie-max-age-minutes: 20

  default-admin:
    enabled: ${DEFAULT_ADMIN_ENABLED}
    email: ${DEFAULT_ADMIN_EMAIL}
    username: ${DEFAULT_ADMIN_USERNAME}
    password: ${DEFAULT_ADMIN_PASSWORD}
    full-name: ${DEFAULT_ADMIN_FULL_NAME:System Admin}
aws:
  region: ${AWS_REGION}
  s3:
    bucket: ${AWS_S3_BUCKET_NAME}


